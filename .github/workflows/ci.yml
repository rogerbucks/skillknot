name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the branch's own head: GitHub's trial merge commit carries the account's display name
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m unittest discover -s scripts
      # A fork's pull request gets no secrets, so only this repo's own runs must hold the word list.
      - env:
          LEAK_TERMS: ${{ secrets.LEAK_TERMS }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            python3 scripts/check.py
          else
            python3 scripts/check.py --history --require-terms
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: File layout
        run: python3 scripts/tidy.py --check
      - name: Markdown
        run: npx --yes markdownlint-cli2@0.24.0 '**/*.md'
      - name: Python
        run: |
          pipx run ruff==0.17.3 check scripts plugins
          pipx run ruff==0.17.3 format --check scripts plugins
      - name: Shell
        run: shellcheck .githooks/pre-push .githooks/pre-commit
      - name: Workflow syntax
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Workflow security
        run: pipx run zizmor==1.31.1 --offline .github/workflows
      - name: Secrets in all history
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner /repo
      - name: Agent Skills format
        run: |
          for skill in plugins/*/skills/*/; do
            [ -d "$skill" ] || continue
            pipx run --spec skills-ref==0.1.1 agentskills validate "$skill"
          done

  # Not required: a site being down says nothing about this repo, so a dead link warns and never blocks.
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" -w /repo lycheeverse/lychee:0.24.2 --no-progress --accept 200,403,429 './**/*.md'
