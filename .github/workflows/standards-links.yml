name: Standards links

# Weekly check that every linked law and standard still resolves, so the registry's cached notes
# are re-confirmed before they go stale. A dead link warns the maintainer and changes nothing.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" -w /repo lycheeverse/lychee:0.24.2 --no-progress --accept 200,403,429 './plugins/*/skills/*/references/standards/*.md'
